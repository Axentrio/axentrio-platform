name: Database Backup

on:
  schedule:
    # Run daily at 02:00 UTC
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    # 18 Aug 2026: apt install of postgresql-client-17 hung until the 6 h runner cap.
    timeout-minutes: 20
    steps:
      - name: Sanity-check DB URL secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${DATABASE_URL:-}" ]; then
            echo "::error::DATABASE_PUBLIC_URL secret is empty"
            exit 1
          fi
          # Print only the host so we can see WHICH DB we're backing up in the run log,
          # without leaking credentials. Format: user:***@host/db
          MASKED=$(echo "$DATABASE_URL" | sed -E 's|(://[^:]+):[^@]+@|\1:***@|')
          echo "Target: $MASKED"

      # Crunchy Bridge is PG17. Do not apt-install the client: that step hung for 6 h
      # on 18 Aug 2026 (apt.postgresql.org). The official image already has pg_dump 17.
      - name: Pull pg_dump image
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            docker pull postgres:17 && exit 0
            sleep 10
          done
          exit 1

      - name: Create database backup
        env:
          DATABASE_URL: ${{ secrets.DATABASE_PUBLIC_URL }}
          PGSSLMODE: require
        run: |
          set -euo pipefail
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)
          FILENAME="backup_${TIMESTAMP}.sql.gz"

          dump() {
            docker run --rm \
              -e PGSSLMODE \
              postgres:17 \
              pg_dump "$DATABASE_URL" \
                --no-owner --no-privileges \
                --clean --if-exists
          }

          attempt=1
          max_attempts=3
          while true; do
            set +e
            dump 2>dump.err | gzip -9 > "$FILENAME"
            status=$?
            set -e
            if [ "$status" -eq 0 ]; then
              break
            fi
            cat dump.err >&2
            if grep -q 'password authentication failed' dump.err; then
              echo "::error::pg_dump rejected the DATABASE_PUBLIC_URL password. Rotate the secret."
              exit 1
            fi
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::pg_dump failed after ${max_attempts} attempts"
              exit 1
            fi
            echo "pg_dump failed (attempt ${attempt}/${max_attempts}); retry in 20s"
            attempt=$((attempt + 1))
            sleep 20
          done

          SIZE=$(stat -c%s "$FILENAME" 2>/dev/null || stat -f%z "$FILENAME")
          # Fail if the dump is suspiciously small (gzip header for empty input is ~20 bytes;
          # a real schema-only dump should be at least a few KB).
          if [ "$SIZE" -lt 2048 ]; then
            echo "::error::Backup file is suspiciously small ($SIZE bytes). pg_dump probably failed."
            exit 1
          fi
          echo "FILENAME=$FILENAME" >> "$GITHUB_ENV"
          echo "Backup created: $FILENAME ($(du -h "$FILENAME" | cut -f1))"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          aws s3 cp "$FILENAME" "s3://chatbot-db-backups/$FILENAME" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Uploaded $FILENAME to R2"

      - name: Cleanup old backups (keep last 30 days)
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          CUTOFF_DATE=$(date -d '30 days ago' +%Y-%m-%d 2>/dev/null || date -v-30d +%Y-%m-%d)
          aws s3 ls "s3://chatbot-db-backups/" --endpoint-url "$R2_ENDPOINT" | while read -r line; do
            FILE_DATE=$(echo "$line" | awk '{print $1}')
            FILE_NAME=$(echo "$line" | awk '{print $4}')
            if [[ "$FILE_DATE" < "$CUTOFF_DATE" && -n "$FILE_NAME" ]]; then
              aws s3 rm "s3://chatbot-db-backups/$FILE_NAME" --endpoint-url "$R2_ENDPOINT"
              echo "Deleted old backup: $FILE_NAME"
            fi
          done
