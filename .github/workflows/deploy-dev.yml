name: Deploy dev API

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to build and deploy to api.dev.axentrio.com
        required: false
        default: main
        type: string

permissions:
  contents: read
  packages: write

jobs:
  deploy-dev:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref }}

      - name: Resolve checked-out SHA
        run: echo "DEV_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies and build
        working-directory: api
        run: npm ci && npm run build

      - name: Stamp the commit into the build
        continue-on-error: true
        run: echo "$DEV_SHA" > api/public/commit.txt

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ghcr.io/axentrio/axentrio-api:dev-${{ env.DEV_SHA }}

      - name: Sync infra and deploy dev-api
        env:
          HOST: ${{ secrets.NONPROD_HOST }}
          SSH_KEY: ${{ secrets.NONPROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.NONPROD_KNOWN_HOSTS }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # shellcheck source=../scripts/vps-ssh-setup.sh
          source .github/scripts/vps-ssh-setup.sh
          rsync -az -e "$AXENTRIO_SSH" \
            --exclude 'cloud-init.yml' \
            --exclude 'env.*.example' \
            --exclude 'render-user-data.sh' \
            infra/vps/ "deploy@${HOST}:/opt/axentrio/"
          printf '%s\n' "$GHCR_TOKEN" | $AXENTRIO_SSH "deploy@${HOST}" \
            "docker login ghcr.io -u ${GHCR_USER} --password-stdin && /opt/axentrio/deploy.sh dev-${DEV_SHA} compose.nonprod.yml dev-api"
