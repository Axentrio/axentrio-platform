name: Nonprod Database Backup

# Staging and dev share one Postgres volume. A dump per database on R2
# is the off-box copy. Do not write the only copy onto the VPS disk.
on:
  schedule:
    # 03:00 UTC, after the production Crunchy dump at 02:00.
    - cron: "0 3 * * *"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: staging
    steps:
      - uses: actions/checkout@v5

      - name: Dump axentrio_staging and axentrio_dev
        env:
          HOST: ${{ secrets.NONPROD_HOST }}
          SSH_KEY: ${{ secrets.NONPROD_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.NONPROD_KNOWN_HOSTS }}
        run: |
          set -euo pipefail
          # shellcheck source=../scripts/vps-ssh-setup.sh
          source .github/scripts/vps-ssh-setup.sh
          TIMESTAMP=$(date -u +%Y%m%dT%H%M%SZ)

          dump_one() {
            local db="$1"
            local filename="backup_${db}_${TIMESTAMP}.sql.gz"
            echo "Dumping ${db}"
            $AXENTRIO_SSH "deploy@${HOST}" \
              "docker exec axentrio-postgres-1 pg_dump -U postgres --no-owner --no-privileges --clean --if-exists ${db}" \
              | gzip -9 > "$filename"
            local size
            size=$(stat -c%s "$filename")
            if [ "$size" -lt 1024 ]; then
              echo "::error::${filename} is suspiciously small ($size bytes)"
              exit 1
            fi
            echo "Created ${filename} ($(du -h "$filename" | cut -f1))"
            printf '%s\n' "$filename"
          }

          STAGING_FILE=$(dump_one axentrio_staging)
          DEV_FILE=$(dump_one axentrio_dev)
          {
            echo "STAGING_FILE=$STAGING_FILE"
            echo "DEV_FILE=$DEV_FILE"
          } >> "$GITHUB_ENV"

      - name: Upload to Cloudflare R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          aws s3 cp "$STAGING_FILE" "s3://chatbot-db-backups/nonprod/staging/$STAGING_FILE" \
            --endpoint-url "$R2_ENDPOINT"
          aws s3 cp "$DEV_FILE" "s3://chatbot-db-backups/nonprod/dev/$DEV_FILE" \
            --endpoint-url "$R2_ENDPOINT"
          echo "Uploaded staging and dev dumps to R2"

      - name: Cleanup old nonprod backups (keep last 14 days)
        continue-on-error: true
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          set -euo pipefail
          CUTOFF_DATE=$(date -d '14 days ago' +%Y-%m-%d)
          for prefix in nonprod/staging/ nonprod/dev/; do
            aws s3 ls "s3://chatbot-db-backups/${prefix}" --endpoint-url "$R2_ENDPOINT" | while read -r line; do
              FILE_DATE=$(echo "$line" | awk '{print $1}')
              FILE_NAME=$(echo "$line" | awk '{print $4}')
              if [[ "$FILE_DATE" < "$CUTOFF_DATE" && -n "$FILE_NAME" ]]; then
                aws s3 rm "s3://chatbot-db-backups/${prefix}${FILE_NAME}" --endpoint-url "$R2_ENDPOINT"
                echo "Deleted ${prefix}${FILE_NAME}"
              fi
            done
          done

      - name: Delete dumps from the runner
        if: always()
        run: rm -f backup_axentrio_staging_*.sql.gz backup_axentrio_dev_*.sql.gz
