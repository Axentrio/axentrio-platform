# Project env file: /opt/axentrio/.env
# Compose interpolates REDIS_PASSWORD, N8N_DB_PASSWORD, N8N_ENCRYPTION_KEY,
# and TAG from that file (and the process environment). Caddy is stock caddy:2
# (HTTP-01). Domain DNS stays on Netlify.
# NEVER put WEBHOOK_URL in .env; n8n env is inline below.

networks:
  axentrio:
    driver: bridge

volumes:
  redis-data:
  n8n-data:
  n8n-pg-data:
  caddy-data:
  caddy-config:
  clamav-data:

services:
  api:
    image: ghcr.io/axentrio/axentrio-api:${TAG:?set TAG}
    restart: unless-stopped
    env_file:
      - /opt/axentrio/.env
    expose:
      - "3000"
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - axentrio

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --requirepass
      - "${REDIS_PASSWORD:?set REDIS_PASSWORD in /opt/axentrio/.env}"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory
      - 2gb
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:?set REDIS_PASSWORD in /opt/axentrio/.env}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - axentrio

  clamav:
    image: clamav/clamav:1.4
    restart: unless-stopped
    environment:
      CLAMD_CONF_StreamMaxLength: 26M
    volumes:
      - clamav-data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdcheck.sh"]
      interval: 60s
      timeout: 10s
      start_period: 300s
      retries: 3
    networks:
      - axentrio

  n8n-db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: n8n
      POSTGRES_PASSWORD: "${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in /opt/axentrio/.env}"
      POSTGRES_DB: n8n
    volumes:
      - n8n-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U n8n -d n8n"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - axentrio

  n8n:
    image: n8nio/n8n:2.23.3
    restart: unless-stopped
    environment:
      DB_TYPE: postgresdb
      DB_POSTGRESDB_HOST: n8n-db
      DB_POSTGRESDB_PORT: "5432"
      DB_POSTGRESDB_DATABASE: n8n
      DB_POSTGRESDB_USER: n8n
      DB_POSTGRESDB_PASSWORD: "${N8N_DB_PASSWORD:?set N8N_DB_PASSWORD in /opt/axentrio/.env}"
      N8N_ENCRYPTION_KEY: "${N8N_ENCRYPTION_KEY:?set N8N_ENCRYPTION_KEY in /opt/axentrio/.env}"
      N8N_HOST: ops.axentrio.com
      N8N_PORT: "5678"
      N8N_PROTOCOL: https
      N8N_LISTEN_ADDRESS: "::"
      N8N_EDITOR_BASE_URL: https://ops.axentrio.com
      N8N_PROXY_HOPS: "1"
      N8N_SECURE_COOKIE: "true"
      N8N_RUNNERS_ENABLED: "true"
      N8N_RUNNERS_MODE: internal
      N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS: "false"
      GENERIC_TIMEZONE: UTC
      TZ: UTC
      WEBHOOK_URL: https://ops.axentrio.com
      EXECUTIONS_MODE: regular
    volumes:
      - n8n-data:/home/node/.n8n
    depends_on:
      n8n-db:
        condition: service_healthy
    networks:
      - axentrio

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - caddy-data:/data
      - caddy-config:/config
      - ./Caddyfile.prod:/etc/caddy/Caddyfile:ro
      - ./portal-prod:/srv/portal-prod:ro
    depends_on:
      - api
      - n8n
    networks:
      - axentrio
