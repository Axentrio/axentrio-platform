name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api-unit:
    runs-on: ubuntu-latest
    env:
      JWT_SECRET: test-jwt-secret-for-ci
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      NODE_ENV: test
      CLERK_SECRET_KEY: test_clerk_key
      CLERK_WEBHOOK_SECRET: test_webhook_secret
      SUPER_ADMIN_EMAILS: test@example.com
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Type-check API
        working-directory: api
        run: npx tsc --noEmit

      - name: Lint API
        working-directory: api
        run: npm run lint

      - name: Run API unit tests
        working-directory: api
        run: npm run test:unit

  api-integration:
    name: api-integration (${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: chatbot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      # The travel-degradation monitor coordinates across instances THROUGH Redis: the incident
      # latch, the probe lease and the ordering of a success against a failure all live there. A
      # double cannot test that, because the double is the part being trusted.
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TEST_DATABASE_URL: postgresql://test:test@localhost:5432/chatbot_test
      TEST_REDIS_URL: redis://localhost:6379
      DATABASE_URL: postgresql://test:test@localhost:5432/chatbot_test
      JWT_SECRET: test-jwt-secret-for-ci
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef
      NODE_ENV: test
      CLERK_SECRET_KEY: test_clerk_key
      CLERK_WEBHOOK_SECRET: test_webhook_secret
      SUPER_ADMIN_EMAILS: test@example.com

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install API dependencies
        working-directory: api
        run: npm ci

      - name: Run API integration tests
        working-directory: api
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          set -euo pipefail
          # Vitest --shard slices files in order, so bot-* / conversation-*
          # land in one job. Round-robin keeps those slow files apart.
          mapfile -t files < <(find src/__tests__/integration -name '*.test.ts' | sort | awk -v s="$SHARD" 'NR % 3 == s % 3')
          echo "Shard ${SHARD}/3: ${#files[@]} files"
          npx vitest run --config vitest.integration.config.ts "${files[@]}"

  portal-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: portal/package-lock.json

      - name: Install Portal dependencies
        working-directory: portal
        run: npm ci

      - name: Type-check Portal
        working-directory: portal
        run: npx tsc --noEmit

      - name: Lint Portal
        working-directory: portal
        run: npm run lint

      - name: Run Portal tests
        working-directory: portal
        run: npx vitest run

      - name: Build Portal
        working-directory: portal
        run: npm run build

  deploy-api:
    needs: [api-unit, api-integration, portal-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies and build
        working-directory: api
        run: npm ci && npm run build

      - name: Upload source maps to Sentry
        continue-on-error: true
        working-directory: api
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
        run: |
          npx @sentry/cli sourcemaps upload ./dist --release="$GITHUB_SHA"

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      # Stamp the commit onto the service BEFORE deploying, so `GET /health` can say what it is
      # running. Railway builds asynchronously and lags this workflow, so a green CI run is not a
      # statement about what is serving traffic — two live-test rounds on 2026-08-12 were spent
      # against a stale build, undetectably. `--skip-deploys` because the deploy is the next step;
      # without it this would trigger a second, redundant one.
      # Bake the commit into the image so `GET /health` can say what it is running. Written into
      # the SOURCE that `railway up` uploads, not set as a service variable: a variable is read
      # when a container starts, so it can outlive a failed build and make an old image report a
      # new commit — a lie told in exactly the stale-build case this exists to catch. See
      # `api/src/utils/build-info.ts`.
      #
      # OVERWRITES a tracked placeholder rather than creating an ignored file. The first attempt
      # gitignored it, on the reasoning that a checked-in sha would ship stale in every build —
      # and `railway up` ignores paths from .gitignore, so the file never reached the image and
      # /health reported "unknown" from a deploy that had otherwise worked perfectly. The tracked
      # content is always the literal `unknown`, which `build-info` rejects as not-a-sha, so a
      # stale value cannot ship and an accidental commit of a real one shows up in the diff.
      #
      # NEVER fatal. A diagnostic that can stop a deploy is worse than no diagnostic. A failed
      # write leaves `commit: "unknown"` on /health, which is honest, and the deploy proceeds.
      - name: Stamp the commit into the build
        continue-on-error: true
        run: echo "$GITHUB_SHA" > api/public/commit.txt

      - name: Deploy to Railway
        working-directory: .
        run: railway up --service chatbot-api --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

  deploy-portal:
    needs: [api-unit, api-integration, portal-build]
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v5

      - name: Install Railway CLI
        run: npm install -g @railway/cli

      - name: Deploy to Railway
        working-directory: .
        run: railway up --service chatbot-portal --detach
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
